<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Restriction</title>
    <link rel="stylesheet" href="/css/pico.min.css">
    <style>
        body { padding: 20px; }
        .control-panel { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #eee; }
        .status-badge { display: inline-block; padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
        .status-enabled { background: #d1fae5; color: #065f46; }
        .status-restricted { background: #fee2e2; color: #991b1b; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
        .del-btn { background: #ef4444; color: white; border: none; padding: 5px 10px; font-size: 0.8rem; cursor: pointer; border-radius: 4px; }
        .warn { color: #d97706; font-size: 0.9rem; margin-top: 10px; }
    </style>
    <script src="security_check.js"></script>
</head>
<body>
    <h2>Admin Restriction</h2>
    
    <div class="control-panel">
        <label><strong>Access Mode:</strong></label>
        <div style="display: flex; align-items: center; gap: 15px; margin-top: 10px;">
            <label><input type="radio" name="mode" value="ENABLED" onchange="updateMode('ENABLED')"> Open</label>
            <label><input type="radio" name="mode" value="RESTRICTED" onchange="updateMode('RESTRICTED')"> Restricted</label>
        </div>
        <div id="current-status" style="margin-top: 15px;">Status: Loading...</div>
        <div class="warn" id="my-mac-warn">Your MAC: Detecting...</div>
    </div>

    <div class="control-panel" id="whitelist-panel" style="display: none;">
        <h4>Allowed MACs</h4>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="new-mac" placeholder="AA:BB:CC:DD:EE:FF" style="margin-bottom: 0;">
            <button onclick="addMac()" style="width: auto; margin-bottom: 0;">Add</button>
        </div>
        <table>
            <thead><tr><th>MAC Address</th><th>Action</th></tr></thead>
            <tbody id="mac-list"></tbody>
        </table>
    </div>

    <script>
        let myMac = '';

        function loadData() {
            // Get my info first
            fetch('/api/my_info.php').then(r=>r.json()).then(d => {
                myMac = d.mac;
                document.getElementById('my-mac-warn').innerText = `Your MAC: ${myMac} (Ensure this is in the list!)`;
            });

            fetch('../../shell_exec/admin_restrict.php')
                .then(r => r.json())
                .then(data => {
                    document.querySelector(`input[value="${data.status}"]`).checked = true;
                    
                    const statusDiv = document.getElementById('current-status');
                    if (data.status === 'ENABLED') {
                        statusDiv.innerHTML = '<span class="status-badge status-enabled">OPEN ACCESS</span>';
                    } else {
                        statusDiv.innerHTML = '<span class="status-badge status-restricted">RESTRICTED MODE</span>';
                    }
                    
                    // Always show the panel so admin can manage list anytime
                    document.getElementById('whitelist-panel').style.display = 'block';

                    const tbody = document.getElementById('mac-list');
                    tbody.innerHTML = '';
                    data.whitelist.forEach(mac => {
                        const isMe = (mac === myMac) ? ' (You)' : '';
                        tbody.innerHTML += `
                            <tr>
                                <td>${mac} ${isMe}</td>
                                <td><button class="del-btn" onclick="delMac('${mac}')">Remove</button></td>
                            </tr>`;
                    });
                });
        }

        function updateMode(mode) {
            if (mode === 'RESTRICTED' && !confirm(`WARNING: Ensure your MAC (${myMac}) is added first, or you will be locked out!`)) {
                loadData(); return;
            }
            if (!confirm(`Switch Admin Access to ${mode}?`)) { loadData(); return; }
            postData({ action: 'set_status', status: mode });
        }

        function addMac() {
            const mac = document.getElementById('new-mac').value || myMac; // Default to self if empty
            postData({ action: 'add_mac', mac: mac });
            document.getElementById('new-mac').value = '';
        }

        function delMac(mac) {
            if (confirm("Remove access for this device?")) {
                postData({ action: 'del_mac', mac: mac });
            }
        }

        function postData(payload) {
            fetch('../../shell_exec/admin_restrict.php', {
                method: 'POST',
                body: JSON.stringify(payload)
            }).then(() => loadData());
        }

        loadData();
    </script>
</body>
</html>
