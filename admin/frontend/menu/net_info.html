<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Information</title>
    <link rel="stylesheet" href="/css/pico.min.css">
    <style>
        body { padding: 20px; height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden; }
        h2 { margin-bottom: 10px; flex-shrink: 0; }
        #log-container {
            background: #222;
            color: #eee;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            overflow-y: auto;
            border-radius: 4px;
            flex-grow: 1;
            white-space: pre-wrap;
            font-size: 0.85rem;
            border: 1px solid #444;
        }
        .controls { margin-bottom: 10px; flex-shrink: 0; display: flex; gap: 10px; }
        .controls button { width: auto; padding: 5px 20px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <h2>Network Information</h2>
    <div class="controls">
        <button onclick="fetchNetInfo()">Refresh</button>
    </div>
    <div id="log-container">Loading network info...</div>

    <script>
        function fetchNetInfo() {
            const container = document.getElementById('log-container');
            container.style.opacity = '0.5';
            
            fetch('../../shell_exec/ip_addr.php')
                .then(r => {
                    if(!r.ok) throw new Error("Access Denied");
                    return r.text();
                })
                .then(data => {
                    container.innerText = data || "No data available.";
                    container.style.opacity = '1';
                })
                .catch(e => {
                    container.innerText = "Error loading info: " + e.message;
                    container.style.opacity = '1';
                });
        }
        
        fetchNetInfo();
    </script>
</body>
</html>
